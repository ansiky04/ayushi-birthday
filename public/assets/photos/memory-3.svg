<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0314"/>
      <stop offset="40%" stop-color="#160829"/>
      <stop offset="75%" stop-color="#2a0d45"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="1"/>
      <stop offset="35%" stop-color="#fef3c7" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#fbcfe8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0314" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bgGrad3)"/>

  <!-- Crescent Moon with Ambient Halo -->
  <circle cx="560" cy="240" r="140" fill="url(#moonGlow)"/>
  <circle cx="560" cy="240" r="50" fill="#fffbeb"/>
  <circle cx="580" cy="230" r="46" fill="#0f051c"/>

  <!-- Shooting Stars & Milkyway -->
  <g opacity="0.8">
    <line x1="200" y1="120" x2="350" y2="220" stroke="url(#moonGlow)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="350" cy="220" r="3" fill="#fff"/>
    <line x1="120" y1="280" x2="220" y2="350" stroke="#fff" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
  </g>

  <!-- Star Constellation forming a heart -->
  <g stroke="#fbcfe8" stroke-width="1.5" stroke-dasharray="4,4" fill="none" opacity="0.65">
    <path d="M400,320 C360,270 300,290 300,340 C300,390 400,440 400,440 C400,440 500,390 500,340 C500,290 440,270 400,320 Z"/>
  </g>
  <g fill="#fff">
    <circle cx="400" cy="320" r="3.5"/>
    <circle cx="360" cy="270" r="3.5"/>
    <circle cx="300" cy="340" r="4"/>
    <circle cx="400" cy="440" r="4.5"/>
    <circle cx="500" cy="340" r="4"/>
    <circle cx="440" cy="270" r="3.5"/>
  </g>

  <!-- Silhouette hill & Couple stargazing -->
  <path d="M0,750 Q400,640 800,750 L800,1000 L0,1000 Z" fill="#090210"/>
  
  <!-- Couple Silhouette sitting on the grassy hill -->
  <g fill="#170624" transform="translate(400, 640)">
    <!-- Person 1 -->
    <circle cx="-25" cy="-35" r="16" fill="#220b36"/>
    <path d="M-45,20 C-45,-20 -10,-20 -10,20 Z" fill="#220b36"/>
    <!-- Person 2 leaning on shoulder -->
    <circle cx="15" cy="-28" r="14" fill="#2a0d42"/>
    <path d="M0,20 C0,-15 32,-15 32,20 Z" fill="#2a0d42"/>
    <!-- Cute heart above them -->
    <path d="M-5,-60 C-15,-75 -35,-65 -35,-45 C-35,-25 -5,-5 -5,-5 C-5,-5 25,-25 25,-45 C25,-65 5,-75 -5,-60 Z" fill="#f43f5e" opacity="0.9" transform="scale(0.5) translate(10,-70)"/>
  </g>

  <!-- Title Card Ribbon -->
  <rect x="100" y="820" width="600" height="90" rx="16" fill="#140624" fill-opacity="0.8" stroke="#a855f7" stroke-width="1.5"/>
  <text x="400" y="860" font-family="'Playfair Display', serif" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">
    UNDERNEATH THE STARS
  </text>
  <text x="400" y="890" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#e9d5ff" text-anchor="middle" letter-spacing="2">
    MY UNIVERSE IS WHERE YOU ARE 🌌
  </text>
</svg>
