<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d124d"/>
      <stop offset="40%" stop-color="#4a154b"/>
      <stop offset="70%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbcfe8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2d124d" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad1)"/>
  
  <!-- Subtle fairy lights & stars -->
  <g opacity="0.7">
    <circle cx="150" cy="180" r="3" fill="#fff" opacity="0.9"/>
    <circle cx="280" cy="120" r="2" fill="#fde68a" opacity="0.8"/>
    <circle cx="650" cy="220" r="4" fill="#fff" opacity="0.9"/>
    <circle cx="520" cy="140" r="2.5" fill="#fbcfe8" opacity="0.8"/>
    <circle cx="200" cy="350" r="3" fill="#fff" opacity="0.6"/>
    <circle cx="680" cy="420" r="3" fill="#fde68a" opacity="0.7"/>
    <circle cx="100" cy="500" r="2" fill="#fff" opacity="0.5"/>
  </g>

  <!-- Big Warm Ambient Glow -->
  <circle cx="400" cy="450" r="260" fill="url(#glow1)"/>

  <!-- Aesthetic Coffee Cups & Warm Steam -->
  <g transform="translate(400, 480)" filter="url(#softGlow1)">
    <!-- Heart over table -->
    <path d="M0, -70 C-30,-110 -80,-80 -80,-40 C-80,10 0,60 0,60 C0,60 80,10 80,-40 C80,-80 30,-110 0,-70 Z" fill="#f43f5e" opacity="0.85"/>
  </g>

  <!-- Silhouette / Aesthetic Composition -->
  <g transform="translate(400, 600)">
    <!-- Café Table Silhouette -->
    <ellipse cx="0" cy="120" rx="220" ry="25" fill="#1b082e" opacity="0.9"/>
    <!-- Cup 1 -->
    <path d="M-80,60 L-70,110 L-30,110 L-20,60 Z" fill="#fffaf5" opacity="0.9"/>
    <path d="M-22,70 C-10,70 -10,95 -24,95" stroke="#fffaf5" stroke-width="4" fill="none" opacity="0.9"/>
    <!-- Cup 2 -->
    <path d="M20,60 L30,110 L70,110 L80,60 Z" fill="#fbcfe8" opacity="0.9"/>
    <path d="M78,70 C90,70 90,95 76,95" stroke="#fbcfe8" stroke-width="4" fill="none" opacity="0.9"/>
    
    <!-- Rose on table -->
    <path d="M0,90 C-10,80 -25,95 -10,105 C-5,110 10,105 15,95 C20,85 10,80 0,90 Z" fill="#e11d48"/>
    <path d="M-20,105 Q0,112 25,108" stroke="#10b981" stroke-width="3" fill="none"/>
  </g>

  <!-- Title Card Ribbon -->
  <rect x="100" y="820" width="600" height="90" rx="16" fill="#160829" fill-opacity="0.75" stroke="#f472b6" stroke-width="1.5"/>
  <text x="400" y="860" font-family="'Playfair Display', serif" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="1">
    OUR FIRST COFFEE DATE
  </text>
  <text x="400" y="890" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#fbcfe8" text-anchor="middle" letter-spacing="2">
    WHERE OUR STORY BEGAN ✨
  </text>
</svg>
